name: dbt Snowflake Pipeline

on:
  # Exécution manuelle depuis GitHub Actions
  workflow_dispatch:

  # Exécution automatique une fois par mois
  # Le 1er jour de chaque mois à 06:00 UTC
  schedule:
    - cron: "0 6 1 * *"

jobs:
  dbt-build:
    name: Run dbt pipeline
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<'EOF'
          nyc_taxi:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                role: "{{ env_var('SNOWFLAKE_ROLE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
                threads: 4
          EOF

      - name: Check dbt connection
        working-directory: nyc_taxi
        run: dbt debug

      - name: Run dbt build
        working-directory: nyc_taxi
        run: dbt build

      - name: Generate dbt documentation
        working-directory: nyc_taxi
        run: dbt docs generate

      - name: Upload dbt documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-documentation
          path: |
            nyc_taxi/target/manifest.json
            nyc_taxi/target/catalog.json
            nyc_taxi/target/index.html
          if-no-files-found: warn